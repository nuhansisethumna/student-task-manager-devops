<!DOCTYPE html>
<html>
<head>
    <title>Student Task Manager</title>
</head>

<body>

    <h1>Student Task Manager</h1>

    <form action="/add" method="POST">
        <input
            type="text"
            name="task"
            placeholder="Enter a task"
            required
        >

        <button type="submit">Add Task</button>
    </form>

    <h2>Tasks</h2>

    <ul>
        {% for task in tasks %}
            <li>{{ task }}</li>
        {% else %}
            <li>No tasks added yet.</li>
        {% endfor %}
    </ul>

</body>
</html>
